services:
  db:
    image: postgres:16-alpine
    container_name: africa-support-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: support_dev
      POSTGRES_PASSWORD: support_dev_password
      POSTGRES_DB: africa_support
    ports:
      - "5432:5432"
    volumes:
      - support-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_dev -d africa_support"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  support-postgres-data:
